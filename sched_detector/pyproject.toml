[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sched-detector"
version = "1.0.0"
description = "Détection de la politique de scheduling DL de srsENB (srsRAN 4G) à partir de ses logs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pyzmq>=25", "numpy>=1.24"]
testbed = ["pyzmq>=25", "numpy>=1.24"]

[project.scripts]
sched-detect = "sched_detector.cli:main"
sched-simulate = "sched_detector.simulator:main"
srsran-zmq-broker = "sched_detector.testbed.zmq_broker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
